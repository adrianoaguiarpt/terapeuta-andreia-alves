# Publica uma pré-visualização do site no GitHub Pages a cada push no main.
# Ativar uma vez: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Pré-visualização (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar páginas para o subcaminho do Pages
        run: node scripts/build.js
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          STATIC_HOST: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
